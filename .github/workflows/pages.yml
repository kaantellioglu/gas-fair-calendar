name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build 2027 calendar and exports
        run: node 2027/scripts/build.cjs
      - name: Add short 2027 address
        run: |
          cat > 2027/index.html <<'HTML'
          <!doctype html>
          <html lang="tr"><meta charset="utf-8"><title>Gaz Takvimi 2027</title>
          <meta http-equiv="refresh" content="0; url=site/">
          <a href="site/">Gaz Takvimi 2027</a></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
